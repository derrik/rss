[package]
name = "rss"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.8", features = ["derive", "env"] }
ego-tree = "0.11"
feed-rs = "3.0.0"
quick-xml = "0.42.0"
rusqlite = { version = "0.43.0", features = ["bundled"] }
scraper = "0.29.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
ureq = "3.5.2"

[dev-dependencies]
chrono = "0.4.45"
tempfile = "3.27.0"
tiny_http = "0.12.0"

[profile.release]
strip = true
lto = "thin"
